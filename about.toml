# cargo-about configuration for THIRD_PARTY_LICENSES.html (see docs/DEVELOPMENT.md).
#
# The crates scanned are the ones the Python wheels link: normal dependencies
# with `--no-default-features --features python,encryption`, for the wheel
# targets. cargo-about checks this crate's own licence too, hence GPL-3.0-only
# (compatible with every other accepted licence).
accepted = [
    "GPL-3.0-only",
    "Apache-2.0",
    "MIT",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "MIT-0",
    "Apache-2.0 WITH LLVM-exception",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
