[package]
authors = ["Olegs Korsaks <olegs.korsaks@bixority.com>"]
categories = ["api-bindings", "filesystem"]
description = "Unified object storage client API"
edition = "2024"
keywords = ["object-store", "s3", "gcs", "azure", "python"]
license = "GPL-3.0-only"
name = "object-storage-client"
readme = "README.md"
repository = "https://github.com/bixority/object-storage-client"
version = "0.1.4"

[lib]
crate-type = ["cdylib", "rlib"]
name = "object_storage_client"


[dependencies]
async-trait = "0.1"
bytes = "1.12"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
dashmap = "6.2"
futures = "0.3"
futures-util = "0.3"
homedir = "0.3"
http = "1.5"
object_store = { version = "0.14", features = ["aws", "gcp", "azure", "http"] }
percent-encoding = "2.3"
reqwest = { version = "0.13", features = ["rustls"], default-features = false }
ring = "0.17"
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"], optional = true }
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
url = "2.5"

[features]
python = ["dep:pyo3", "dep:pyo3-async-runtimes"]

[[bin]]
name = "osc"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.53", features = ["full", "test-util"] }

[lints.rust]
linker_messages = "allow"
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
needless_for_each = { level = "allow", priority = 1 }

[profile.dev]
debug = true
incremental = true
opt-level = 0

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[profile.release.package."*"]
codegen-units = 1
debug = false
opt-level = 3
strip = true