[package]
authors = ["Olegs Korsaks <bixority@proton.me>"]
categories = ["api-bindings", "filesystem"]
description = "Unified object storage client API"
edition = "2024"
keywords = ["object-store", "s3", "gcs", "azure", "python"]
license = "GPL-3.0-only"
name = "object-storage-client"
readme = "README.md"
repository = "https://github.com/bixority/object-storage-client"
version = "0.0.24"

[lib]
crate-type = ["cdylib", "rlib"]
name = "object_storage_client"


[dependencies]
bytes = "1.11"
futures = "0.3"
object_store = { version = "0.13", features = ["aws", "gcp", "azure", "http"] }
pyo3 = { version = "0.28", features = ["extension-module"], optional = true }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"], optional = true }
thiserror = "2.0"
tokio = { version = "1.52", features = ["full"] }
url = "2.5"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
dashmap = "6.1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
futures-core = "0.3"

[features]
python = ["dep:pyo3", "dep:pyo3-async-runtimes"]

[[bin]]
name = "osc"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.52", features = ["full", "test-util"] }


[profile.dev]
opt-level = 0
incremental = true
debug = true

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = "z"
strip = true