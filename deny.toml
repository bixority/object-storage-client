# cargo-deny configuration. CI runs `cargo deny --all-features check advisories bans sources`.

[advisories]
yanked = "deny"
# Triage an advisory by updating the crate; only if that is impossible, add
# its id here with a reason.
ignore = [
    # astral-tokio-tar is unmaintained (all versions); it comes only from the
    # dev-dependency testcontainers 0.28 (the latest), so it never ships.
    # Remove once testcontainers drops it.
    { id = "RUSTSEC-2026-0440", reason = "dev-only via testcontainers 0.28; no maintained alternative yet" },
    # chrono and humantime are unmaintained (all versions, no safe upgrade).
    # object_store 0.14.2 (the latest) depends on both, so dropping our own
    # chrono use would not remove them. Remove once object_store moves off them.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; required by object_store 0.14.2, no alternative release yet" },
    { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained; required by object_store 0.14.2, no alternative release yet" },
]

[bans]
multiple-versions = "allow"
deny = [
    { crate = "ring", reason = "AWS-LC is the only crypto provider since 0.2.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
