name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by dependabot-merge after it merges (a GITHUB_TOKEN merge starts
  # no push run). Also usable by hand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: quick successive merges would stay untested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Operators run osc on laptops, so the Rust suite runs on macOS. Windows runs
  # the library tests (the cfg(windows) path tests) and compiles every target.
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            commands: cargo test --locked --all-features
          - os: macos-latest
            commands: cargo test --locked --all-features
          - os: windows-latest
            commands: cargo test --locked --lib && cargo check --locked --all-features --all-targets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: test-all-features
      - name: Test
        shell: bash
        run: ${{ matrix.commands }}

  # The MSRV promised in Cargo.toml (rust-version) must build all targets.
  msrv:
    name: MSRV (1.99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked --all-features --all-targets

  integration:
    name: integration (Garage, Azurite, fake-gcs-server)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: test-all-features
      # The 4 GiB round trips are local only (see docs/TESTING.md, "Checksum round trips").
      - run: cargo test --locked --all-features --test integration -- --ignored --skip _4gib

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: No code-generation settings in the committed cargo config
        # Only an allowlist of top-level tables: [profile.*], [env], [build]
        # and [target.*] would change the published artifacts.
        run: >-
          python3 -c 'import sys,tomllib;
          x=set(tomllib.load(open(".cargo/config.toml","rb")))-{"registries"};
          sys.exit(f"unexpected keys in .cargo/config.toml: {sorted(x)}" if x else 0)'
      - name: Every action is pinned to a full commit SHA
        run: '! grep -rnP "^\s*(-\s*)?uses:\s+(?!\./)(?![^@\s]+@[0-9a-f]{40}(\s|$))" .github/workflows'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  features:
    name: feature builds + fuzz crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features --features encryption -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features --features python -- -D warnings
      # The osc binary without the desktop browser (cli implies encryption).
      - run: cargo clippy --locked --all-targets --no-default-features --features cli -- -D warnings
      # The desktop browser on its own (gui implies cli and encryption).
      - run: cargo clippy --locked --all-targets --no-default-features --features gui -- -D warnings
      - run: cargo check --locked --no-default-features --features python
      - run: cargo check --locked --features fuzzing
      # The library without dev-dependency features (no --all-targets), so
      # features that only the dev-dependency tokio `full` enables are caught.
      - run: cargo check --locked --no-default-features --lib
      - run: cargo check --locked --no-default-features --features encryption --lib
      - run: cargo check --locked --no-default-features --features gui --bins
      # Keeps `encryption::fuzzing` and the fuzz targets compiling, against the
      # committed fuzz/Cargo.lock.
      - run: cargo check --locked --manifest-path fuzz/Cargo.toml --target-dir target

  python:
    name: python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev --group oracle --locked --no-install-project
      - run: uv run --no-sync maturin develop --locked
      - run: uv run --no-sync pytest
      # Container tests (Garage, Azurite) without the local-only 4 GiB tier.
      - run: uv run --no-sync pytest -m "integration and not large"

  esdk-interop:
    name: ESDK interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: test-all-features
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --group oracle --locked --no-install-project
      # `shell: bash` runs with pipefail. The step fails unless exactly one
      # oracle test passed, so renaming the test cannot silently drop the check.
      - name: ESDK interop (exactly one oracle test)
        shell: bash
        run: |
          cargo test --locked --all-features --lib -- --ignored oracle 2>&1 | tee oracle.log
          grep -q 'test result: ok. 1 passed' oracle.log
        env:
          UV_NO_SYNC: "1"

  deny:
    name: cargo deny (advisories, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans sources
          arguments: --all-features
      # The fuzz crate is its own workspace with its own lockfile.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: fuzz/Cargo.toml
          command: check advisories bans sources
          arguments: --all-features

  # Merges a Dependabot PR only after every other job above has succeeded.
  #
  # `pull_request` (not `pull_request_target`): the PR's code runs with a
  # read-only token and no repository secrets, and its build cache is scoped to
  # the PR. Code merged to main runs in main's cache scope, so the release build
  # uses no build cache (no sccache). A fork PR
  # never gets a write token here, so this job cannot act on one.
  dependabot-merge:
    name: Approve and merge (Dependabot)
    needs: [tests, msrv, integration, lint, features, python, esdk-interop, deny]
    # The PR author, not only `github.actor` (whoever triggered the latest event).
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.actor == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Needed for `gh workflow run` after the merge.
      actions: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      # Only cargo patch updates of crates outside the reviewed list are merged.
      # Everything else stays open for human review.
      - name: Approve and merge
        if: >-
          steps.metadata.outputs.package-ecosystem == 'cargo'
          && steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPENDENCIES: ${{ steps.metadata.outputs.dependency-names }}
          # Any crate that handles keys or credentials must be listed here.
          REVIEWED: aws-lc-rs aws-config aws-credential-types aws-runtime aws-sigv4 aws-types object_store reqwest pyo3 pyo3-async-runtimes zeroize rustix
        run: |
          IFS=', ' read -ra deps <<< "$DEPENDENCIES"
          for dep in "${deps[@]}"; do
            for reviewed in $REVIEWED; do
              if [ "$dep" = "$reviewed" ]; then
                echo "$dep is on the reviewed list; leaving the PR open."
                exit 0
              fi
            done
          done
          gh pr review "$PR_NUMBER" --approve --body "Automated approval: the full test suite passed for this patch update."
          # Merge exactly the commit that was tested.
          gh pr merge "$PR_NUMBER" --merge --match-head-commit "$PR_HEAD_SHA"
          # A merge made with GITHUB_TOKEN starts no push run, so the merged
          # main commit would stay untested. workflow_dispatch is exempt from
          # that rule. This job's `if` requires event_name == 'pull_request',
          # so the dispatched run cannot start another merge. The run joins the
          # `Tests-refs/heads/main` concurrency group, which never cancels
          # on main: it queues behind a running one and replaces an older
          # pending one (the newer run tests a superset of the commits).
          gh workflow run tests.yaml --ref main
