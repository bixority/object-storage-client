[package]
authors = ["Olegs Korsaks <olegs.korsaks@bixority.com>"]
categories = ["api-bindings", "filesystem"]
description = "Unified object storage client API"
rust-version = "1.99"
edition = "2024"
keywords = ["object-store", "s3", "gcs", "azure", "python"]
license = "GPL-3.0-only"
name = "object-storage-client"
readme = "README.md"
repository = "https://github.com/bixority/object-storage-client"
version = "0.4.2"

[lib]
# maturin adds the cdylib crate type itself; do not list it here.
name = "object_storage_client"


[dependencies]
async-trait = "0.1"
aws-config = { version = "1.13", default-features = false, features = ["rt-tokio", "default-https-client", "sso", "credentials-process"] }
aws-credential-types = "1.3"
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
aws-runtime = "1.10"
aws-sdk-ssooidc = { version = "1.121", default-features = false, optional = true }
aws-sigv4 = { version = "1.6", default-features = false, features = ["sign-http", "http1"] }
aws-types = "1.7"
bytes = "1.12"
chrono = "0.4"
clap = { version = "4.6", features = ["derive", "env"], optional = true }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "clipboard", "links"], optional = true }
egui_extras = { version = "0.37.0", default-features = false, optional = true }
# Only for its bundled icon and emoji fonts (folder/file/arrow glyphs); eframe
# brings everything else.
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"], optional = true }
futures = "0.3"
http = "1.5"
http-body = "1"
object_store = { version = "0.14", features = ["aws", "gcp", "azure", "http"] }
percent-encoding = "2.3"
reqwest = { version = "0.13", features = ["rustls"], default-features = false }
pyo3 = { version = "0.30", features = ["bytes"], optional = true }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"], optional = true }
serde_json = "1"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"], optional = true }
tracing = "0.1"
url = "2.5"
walkdir = "2"
zeroize = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[features]
default = ["encryption", "cli"]
# The `osc` binary and its `cli` module (implies `encryption`); the Python
# wheel does not need it.
cli = ["dep:clap", "dep:tokio-util", "tokio/signal", "tokio/io-std", "tokio/macros", "tokio/process", "encryption"]
encryption = ["dep:zeroize"]
# The `osc-gui` binary and its `gui` module (a two-pane desktop browser).
gui = ["cli", "dep:aws-sdk-ssooidc", "dep:eframe", "dep:egui", "dep:egui_extras"]
# Exposes `encryption::fuzzing` harness entry points for the `fuzz/` crate.
fuzzing = ["encryption"]
python = ["dep:pyo3", "dep:pyo3-async-runtimes", "encryption"]

[[bin]]
name = "osc"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "osc-gui"
path = "src/bin/osc-gui.rs"
required-features = ["gui"]

[[bench]]
name = "throughput"
harness = false
required-features = ["encryption"]

[[test]]
name = "perf_guards"
path = "tests/perf_guards.rs"
required-features = ["encryption"]

[dev-dependencies]
alloc-counter = { path = "benches/alloc-counter" }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-types = "1"
proptest = "1"
tempfile = "3.27"
testcontainers = { version = "0.28", default-features = false, features = ["aws-lc-rs", "reusable-containers"] }
tokio = { version = "1.54", features = ["full", "test-util"] }

[lints.rust]
linker_messages = "allow"
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"

# Dependencies keep only line tables: backtraces stay useful and test binaries
# shrink by hundreds of MB. The crate itself keeps full debug info.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
# No panic = "abort": the cdylib must unwind so pyo3 turns panics into
# exceptions, and drop guards must run.
codegen-units = 1
lto = "fat"
strip = true
