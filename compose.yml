name: object-storage-client

services:
  garage:
    image: docker.io/dxflrs/garage:v2.5.0
    command: [ "/garage", "server", "--single-node", "--default-bucket" ]
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3902:3902"
      - "127.0.0.1:3903:3903"
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: "${S3_ACCESS_KEY_ID:-rootroot}"
      GARAGE_DEFAULT_SECRET_KEY: "${S3_SECRET_ACCESS_KEY:-rootrootrootroot}"
      GARAGE_DEFAULT_BUCKET: "${S3_BUCKET:-default}"
      # Overrides admin_token in garage.toml so the web UI below always agrees.
      GARAGE_ADMIN_TOKEN: "${GARAGE_ADMIN_TOKEN:-0123456789abcdef0123456789abcdef}"
    healthcheck:
      test: [ "CMD", "/garage", "health" ]
      interval: 3s
      timeout: 10s
      retries: 10
      start_period: 10s
    volumes:
      - ./.docker/garage.toml:/etc/garage.toml:ro,z
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks:
      - common

  garage-webui:
    image: docker.io/noooste/garage-ui:v0.14.0
    ports:
      - "127.0.0.1:3909:8080"
    environment:
      GARAGE_UI_GARAGE_TOML: "/etc/garage.toml"
      GARAGE_UI_GARAGE_ENDPOINT: "http://garage:3900"
      GARAGE_UI_GARAGE_ADMIN_ENDPOINT: "http://garage:3903"
      GARAGE_UI_GARAGE_ADMIN_TOKEN: "${GARAGE_ADMIN_TOKEN:-0123456789abcdef0123456789abcdef}"
      # Must match s3_region in .docker/garage.toml (Garage cannot override it by env).
      GARAGE_UI_GARAGE_REGION: "eu-north-1"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health" ]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - ./.docker/garage.toml:/etc/garage.toml:ro,z
    depends_on:
      garage:
        condition: service_healthy
    networks:
      - common

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: [ "azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--location", "/data", "--skipApiVersionCheck" ]
    ports:
      - "127.0.0.1:10000:10000"
    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "10000" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - azurite-data:/data
    networks:
      - common

volumes:
  garage-meta:
  garage-data:
  azurite-data:


networks:
  common:
    driver: bridge
