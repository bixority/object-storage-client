name: Dependabot update - test and merge

# `pull_request` (not `pull_request_target`): the PR's code runs with a
# read-only token and no repository secrets, and its build cache is scoped to
# the PR, so it cannot poison the cache used by the release workflow. A fork PR
# never gets a write token here, so the merge job cannot act on one.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Run unit tests (Dependabot PR)
    # The PR author, not `github.actor` (whoever triggered the latest event).
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --all --locked --verbose

  merge:
    name: Approve and merge
    needs: test
    if: >-
      needs.test.result == 'success'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.actor == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              event: 'APPROVE',
              body: 'Automated approval: tests passed for Dependabot update.'
            });

      - name: Merge PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            try {
              // Merge exactly the commit that was tested.
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                sha: pr.head.sha,
                merge_method: 'merge'
              });
              core.info('PR merged successfully.');
            } catch (e) {
              core.setFailed('Failed to merge PR: ' + e.message);
            }
