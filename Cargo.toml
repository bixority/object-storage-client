[package]
authors = ["Olegs Korsaks <olegs.korsaks@bixority.com>"]
categories = ["api-bindings", "filesystem"]
description = "Unified object storage client API"
rust-version = "1.99"
edition = "2024"
keywords = ["object-store", "s3", "gcs", "azure", "python"]
license = "GPL-3.0-only"
name = "object-storage-client"
readme = "README.md"
repository = "https://github.com/bixority/object-storage-client"
version = "0.2.3"

[lib]
crate-type = ["cdylib", "rlib"]
name = "object_storage_client"


[dependencies]
async-trait = "0.1"
aws-config = { version = "1.13", default-features = false, features = ["rt-tokio", "default-https-client", "sso", "credentials-process"] }
aws-credential-types = "1.3"
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
aws-runtime = "1.10"
aws-sigv4 = { version = "1.6", default-features = false, features = ["sign-http", "http1"] }
aws-types = "1.7"
bytes = "1.12"
chrono = "0.4"
clap = { version = "4.6", features = ["derive", "env"], optional = true }
futures = "0.3"
http = "1.5"
http-body = "1"
object_store = { version = "0.14", features = ["aws", "gcp", "azure", "http"] }
percent-encoding = "2.3"
reqwest = { version = "0.13", features = ["rustls"], default-features = false }
pyo3 = { version = "0.30", features = ["bytes"], optional = true }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"], optional = true }
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"], optional = true }
tracing = "0.1"
url = "2.5"
zeroize = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[features]
default = ["encryption", "cli"]
# The `osc` binary and its `cli` module; the Python wheel does not need it.
cli = ["dep:clap", "dep:tokio-util", "tokio/signal", "tokio/io-std", "tokio/macros"]
encryption = ["dep:zeroize"]
# Exposes `encryption::fuzzing` harness entry points for the `fuzz/` crate.
fuzzing = ["encryption"]
python = ["dep:pyo3", "dep:pyo3-async-runtimes", "encryption"]

[[bin]]
name = "osc"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "throughput"
harness = false
required-features = ["encryption"]

[[test]]
name = "perf_guards"
path = "tests/perf_guards.rs"
required-features = ["encryption"]

[dev-dependencies]
alloc-counter = { path = "benches/alloc-counter" }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-types = "1"
proptest = "1"
serde_json = "1"
tempfile = "3.27"
testcontainers = { version = "0.28", default-features = false, features = ["aws-lc-rs", "reusable-containers"] }
tokio = { version = "1.54", features = ["full", "test-util"] }

[lints.rust]
linker_messages = "allow"
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
needless_for_each = { level = "allow", priority = 1 }

[profile.dev]
debug = true
incremental = true
opt-level = 0

[profile.release]
# No panic = "abort": the cdylib must unwind so pyo3 turns panics into
# exceptions, and drop guards must run.
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
strip = true
