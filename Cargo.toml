[package]
authors = ["Olegs Korsaks <bixority@proton.me>"]
categories = ["api-bindings", "filesystem"]
description = "Unified object storage client API"
edition = "2024"
keywords = ["object-store", "s3", "gcs", "azure", "python"]
license = "GPL-3.0-only"
name = "object-storage-client"
readme = "README.md"
repository = "https://github.com/bixority/object-storage-client"
version = "0.0.32"

[lib]
crate-type = ["cdylib", "rlib"]
name = "object_storage_client"


[dependencies]
anyhow = "1.0"
bytes = "1.11"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
dashmap = "6.2"
futures = "0.3"
futures-util = "0.3"
http = "1"
object_store = { version = "0.13", features = ["aws", "gcp", "azure", "http"] }
percent-encoding = "2.3"
ring = "0.17"
pyo3 = { version = "0.28", features = ["extension-module"], optional = true }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"], optional = true }
thiserror = "2.0"
tokio = { version = "1.52", features = ["full"] }
url = "2.5"

[features]
python = ["dep:pyo3", "dep:pyo3-async-runtimes"]

[[bin]]
name = "osc"
path = "src/main.rs"

[dev-dependencies]
reqwest = { version = "0.13", features = ["rustls"], default-features = false }
tempfile = "3.27"
tokio = { version = "1.52", features = ["full", "test-util"] }


[profile.dev]
debug = true
incremental = true
opt-level = 0

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[profile.release.package."*"]
codegen-units = 1
debug = false
opt-level = 3
strip = true